const $=id=>document.getElementById(id);
function b64(s){const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function rotl(v,n){return ((v<<n)|(v>>>(32-n)))>>>0}
function qr(x,a,b,c,d){x[a]=(x[a]+x[b])>>>0;x[d]^=x[a];x[d]=rotl(x[d],16);x[c]=(x[c]+x[d])>>>0;x[b]^=x[c];x[b]=rotl(x[b],12);x[a]=(x[a]+x[b])>>>0;x[d]^=x[a];x[d]=rotl(x[d],8);x[c]=(x[c]+x[d])>>>0;x[b]^=x[c];x[b]=rotl(x[b],7)}
function le32(a,i){return (a[i]|(a[i+1]<<8)|(a[i+2]<<16)|(a[i+3]<<24))>>>0}
function chacha(data,key,nonce){const st=new Uint32Array(16);st[0]=0x61707865;st[1]=0x3320646e;st[2]=0x79622d32;st[3]=0x6b206574;for(let i=0;i<8;i++)st[4+i]=le32(key,i*4);st[12]=1;st[13]=le32(nonce,0);st[14]=le32(nonce,4);st[15]=le32(nonce,8);const out=new Uint8Array(data.length);for(let off=0;off<data.length;off+=64){const x=new Uint32Array(st);for(let r=0;r<10;r++){qr(x,0,4,8,12);qr(x,1,5,9,13);qr(x,2,6,10,14);qr(x,3,7,11,15);qr(x,0,5,10,15);qr(x,1,6,11,12);qr(x,2,7,8,13);qr(x,3,4,9,14)}const s=new Uint8Array(64);for(let i=0;i<16;i++){const w=(x[i]+st[i])>>>0,j=i*4;s[j]=w&255;s[j+1]=(w>>>8)&255;s[j+2]=(w>>>16)&255;s[j+3]=(w>>>24)&255}for(let j=0;j<64&&off+j<data.length;j++)out[off+j]=data[off+j]^s[j];st[12]=(st[12]+1)>>>0}return out}
async function derive(p){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(SALT),iterations:ITER},m,256);return new Uint8Array(bits)}
async function openWardrobe(p){const btn=$("unlock"),err=$("err");btn.disabled=true;btn.textContent="جاري الفتح…";err.textContent="";try{const key=await derive(p),plain=chacha(b64(DATA),key,b64(NONCE)),txt=new TextDecoder().decode(plain);if(!txt.startsWith("QNABA::<!doctype html>")&&!txt.startsWith("QNABA::<!DOCTYPE html>"))throw new Error("bad");sessionStorage.setItem("qnaba_pass",p);const html=txt.slice(7);document.open();document.write(html);document.close()}catch(e){err.textContent="كلمة المرور غير صحيحة";btn.disabled=false;btn.textContent="فتح الخزانة ✨";$("pw").select()}}
$("unlock").onclick=()=>openWardrobe($("pw").value);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("unlock").click()});
const saved=sessionStorage.getItem("qnaba_pass");if(saved){$("pw").value=saved;openWardrobe(saved)}
</script>
